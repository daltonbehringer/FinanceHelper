<section id="expenses">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="font-size:1.25rem;">Recurring Expenses</h2>
        <div style="display:flex; gap:0.75rem; align-items:center;">
            <label style="font-size:0.8rem; cursor:pointer;">
                <input type="checkbox" id="show-inactive-expenses" onchange="loadExpenses()"> Show deactivated
            </label>
            <button class="btn btn-primary" onclick="showAddExpenseForm()">Add Expense</button>
        </div>
    </div>
    <div id="add-expense-form" class="card" style="display:none;">
        <h3>Add Recurring Expense</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="exp-name" placeholder="e.g. Rent">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="exp-amount" step="0.01" placeholder="0.00">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Category <span style="font-weight:normal; color:var(--gray-600);">Optional</span></label>
                <input type="text" id="exp-category" placeholder="e.g. Housing, Insurance">
            </div>
            <div class="form-group">
                <label>Due Day of Month <span style="font-weight:normal; color:var(--gray-600);">Optional, 1–28</span></label>
                <input type="number" id="exp-due-day" min="1" max="28" placeholder="Optional">
            </div>
        </div>
        <div style="margin-top:0.75rem; display:flex; gap:0.5rem;">
            <button class="btn btn-success" onclick="createExpense()">Save</button>
            <button class="btn btn-outline" onclick="hideAddExpenseForm()">Cancel</button>
        </div>
    </div>
    <div class="card" style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Due Day</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expenses-table-body"></tbody>
        </table>
        <div id="expenses-empty" class="empty-state" style="display:none;">
            No recurring expenses yet. Add one to track fixed monthly costs.
        </div>
    </div>
</section>
