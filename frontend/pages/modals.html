<!-- Edit Account Modal -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal">
        <h3>Edit Account</h3>
        <input type="hidden" id="edit-id">
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="edit-type">
                    <option value="credit_card">Credit Card</option>
                    <option value="checking">Checking</option>
                    <option value="savings">Savings</option>
                    <option value="loan">Loan</option>
                    <option value="mortgage">Mortgage</option>
                    <option value="line_of_credit">Line of Credit</option>
                    <option value="401k">401(k)</option>
                    <option value="ira">IRA</option>
                    <option value="roth_ira">Roth IRA</option>
                    <option value="brokerage">Brokerage</option>
                    <option value="hsa">HSA</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Interest Rate (%)</label>
                <input type="number" id="edit-rate" step="0.01">
            </div>
            <div class="form-group">
                <label>Minimum Payment</label>
                <input type="number" id="edit-min-payment" step="0.01">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Credit Limit</label>
                <input type="number" id="edit-credit-limit" step="0.01">
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="edit-due-date">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Promo Rate (%) <span style="font-weight:normal; color:var(--gray-600);">Optional</span></label>
                <input type="number" id="edit-promo-rate" step="0.01" placeholder="e.g. 0">
            </div>
            <div class="form-group">
                <label>Promo End Date <span style="font-weight:normal; color:var(--gray-600);">Optional</span></label>
                <input type="date" id="edit-promo-end-date">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-success" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Edit Income Modal -->
<div class="modal-overlay" id="edit-income-modal">
    <div class="modal">
        <h3>Edit Income</h3>
        <input type="hidden" id="edit-income-id">
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-inc-name">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="edit-inc-amount" step="0.01">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Frequency</label>
                <select id="edit-inc-frequency">
                    <option value="weekly">Weekly</option>
                    <option value="biweekly">Biweekly (every 2 weeks)</option>
                    <option value="semimonthly">Semimonthly (twice a month)</option>
                    <option value="monthly">Monthly</option>
                    <option value="annual">Annual</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pay Day of Month <span style="font-weight:normal; color:var(--gray-600);">Optional, 1–28</span></label>
                <input type="number" id="edit-inc-income-day" min="1" max="28" placeholder="Optional">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Most Recent Pay Date <span style="font-weight:normal; color:var(--gray-600);">Optional</span></label>
                <input type="date" id="edit-inc-last-pay-date">
            </div>
            <div></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeEditIncomeModal()">Cancel</button>
            <button class="btn btn-success" onclick="saveIncomeEdit()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Edit Expense Modal -->
<div class="modal-overlay" id="edit-expense-modal">
    <div class="modal">
        <h3>Edit Expense</h3>
        <input type="hidden" id="edit-expense-id">
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="edit-exp-name">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="edit-exp-amount" step="0.01">
            </div>
        </div>
        <div class="form-row" style="grid-template-columns: 1fr auto auto;">
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="edit-exp-category">
            </div>
            <div class="form-group" id="edit-exp-recurring-fields">
                <label>Due Day <span style="font-weight:normal; color:var(--gray-600);">1–28</span></label>
                <input type="number" id="edit-exp-due-day" min="1" max="28" placeholder="—" style="width:5rem;">
            </div>
            <div class="form-group" id="edit-exp-onetime-fields" style="display:none;">
                <label>Due Date</label>
                <input type="date" id="edit-exp-due-date">
            </div>
            <div class="form-group" style="justify-content:flex-end;">
                <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; white-space:nowrap;">
                    <input type="checkbox" id="edit-exp-one-time" onchange="toggleEditExpenseType()">
                    One-time
                </label>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeEditExpenseModal()">Cancel</button>
            <button class="btn btn-success" onclick="saveExpenseEdit()">Save Changes</button>
        </div>
    </div>
</div>
