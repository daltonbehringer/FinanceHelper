<section id="update">
    <h2 style="font-size:1.25rem; margin-bottom:1rem;">Ask Your Advisor</h2>
    <div class="card">
        <div class="form-group">
            <label>Update a balance, ask about upcoming bills, or get financial advice</label>
            <textarea id="update-text" rows="3" placeholder='e.g. "paid $300 on Chase Sapphire" or "when is my next credit card payment due?" or "how should I allocate an extra $500?"'></textarea>
        </div>
        <button class="btn btn-primary" id="parse-btn" onclick="submitChat()">Send</button>
        <div id="parse-error" class="alert alert-error" style="display:none; margin-top:1rem;"></div>
        <div id="parse-preview" style="display:none;"></div>
    </div>
</section>
