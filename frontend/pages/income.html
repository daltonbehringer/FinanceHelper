<section id="income">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 style="font-size:1.25rem;">Recurring Income</h2>
        <div style="display:flex; gap:0.75rem; align-items:center;">
            <label style="font-size:0.8rem; cursor:pointer;">
                <input type="checkbox" id="show-inactive-income" onchange="loadIncome()"> Show deactivated
            </label>
            <button class="btn btn-primary" onclick="showAddIncomeForm()">Add Income</button>
        </div>
    </div>
    <div id="add-income-form" class="card" style="display:none;">
        <h3>Add Recurring Income</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="inc-name" placeholder="e.g. Primary Job">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="inc-amount" step="0.01" placeholder="0.00">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Frequency</label>
                <select id="inc-frequency">
                    <option value="weekly">Weekly</option>
                    <option value="biweekly">Biweekly (every 2 weeks)</option>
                    <option value="semimonthly">Semimonthly (twice a month)</option>
                    <option value="monthly" selected>Monthly</option>
                    <option value="annual">Annual</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pay Day of Month <span style="font-weight:normal; color:var(--gray-600);">Optional, 1–28</span></label>
                <input type="number" id="inc-income-day" min="1" max="28" placeholder="Optional">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Most Recent Pay Date <span style="font-weight:normal; color:var(--gray-600);">Optional — helps AI predict upcoming dates</span></label>
                <input type="date" id="inc-last-pay-date">
            </div>
            <div></div>
        </div>
        <div style="margin-top:0.75rem; display:flex; gap:0.5rem;">
            <button class="btn btn-success" onclick="createIncome()">Save</button>
            <button class="btn btn-outline" onclick="hideAddIncomeForm()">Cancel</button>
        </div>
    </div>
    <div class="card" style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Frequency</th>
                    <th>Monthly Equiv.</th>
                    <th>Pay Day</th>
                    <th>Last Paid</th>
                    <th>Next Payday</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="income-table-body"></tbody>
        </table>
        <div id="income-empty" class="empty-state" style="display:none;">
            No income sources yet. Add one to improve AI recommendations.
        </div>
    </div>
</section>
