# Adds the Litestream binary to the Railway (nixpacks) build so the start
# command can wrap uvicorn with `litestream replicate -exec`.
#
# We download the binary into /usr/local/bin in a dedicated phase rather than
# adding it to phases.setup.nixPkgs, because overriding nixPkgs would replace
# nixpacks' auto-detected Python toolchain.

[phases.litestream]
dependsOn = ["setup"]
cmds = [
  "curl -fsSL https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz | tar -xzf - -C /usr/local/bin litestream",
]
