name: backup-verify

# Monthly proof that the (age-encrypted) R2 replica restores cleanly. Phase 4,
# WS1. Uses a READ-ONLY, bucket-scoped R2 token plus the age identity — both
# repo secrets the owner provisions. A failure surfaces as a failed GitHub
# Action (notification). Manual runs allowed via workflow_dispatch.

on:
  schedule:
    - cron: "0 7 1 * *" # 07:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    env:
      LITESTREAM_VERSION: v0.3.13
      DB_PATH: /tmp/verify/restored.db
      LITESTREAM_REPLICA_BUCKET: ${{ secrets.LITESTREAM_REPLICA_BUCKET }}
      LITESTREAM_REPLICA_ENDPOINT: ${{ secrets.LITESTREAM_REPLICA_ENDPOINT }}
      LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_VERIFY_ACCESS_KEY_ID }}
      LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_VERIFY_SECRET_ACCESS_KEY }}
      LITESTREAM_AGE_IDENTITY: ${{ secrets.LITESTREAM_AGE_IDENTITY }}
      LITESTREAM_AGE_RECIPIENT: ${{ secrets.LITESTREAM_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — required secrets present
        run: |
          : "${LITESTREAM_REPLICA_BUCKET:?missing LITESTREAM_REPLICA_BUCKET secret}"
          : "${LITESTREAM_REPLICA_ENDPOINT:?missing LITESTREAM_REPLICA_ENDPOINT secret}"
          : "${LITESTREAM_ACCESS_KEY_ID:?missing LITESTREAM_VERIFY_ACCESS_KEY_ID secret}"
          : "${LITESTREAM_SECRET_ACCESS_KEY:?missing LITESTREAM_VERIFY_SECRET_ACCESS_KEY secret}"
          : "${LITESTREAM_AGE_IDENTITY:?missing LITESTREAM_AGE_IDENTITY secret}"

      - name: Install Litestream
        run: |
          curl -fsSL "https://github.com/benbjohnson/litestream/releases/download/${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -C /usr/local/bin -xz
          litestream version

      - name: Restore latest replica
        run: |
          mkdir -p /tmp/verify
          litestream restore -config litestream.yml -o "$DB_PATH" "$DB_PATH"

      - name: Integrity check + row-count sanity
        run: |
          status=$(sqlite3 "$DB_PATH" "PRAGMA integrity_check;")
          echo "integrity_check: $status"
          [ "$status" = "ok" ] || { echo "::error::integrity_check failed"; exit 1; }

          users=$(sqlite3 "$DB_PATH" "SELECT count(*) FROM users;")
          accounts=$(sqlite3 "$DB_PATH" "SELECT count(*) FROM accounts;")
          echo "users=$users accounts=$accounts"
          [ "$users" -gt 0 ] || { echo "::error::0 users in restored DB"; exit 1; }
          [ "$accounts" -gt 0 ] || { echo "::error::0 accounts in restored DB"; exit 1; }
